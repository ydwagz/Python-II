{% extends "base.html" %}

{% block content %}
    <div style="text-align: center; margin-top: 50px;">
        <h1>Products</h1>
        <ul>
            {% for product in products %}
                <li><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></li>
            {% empty %}
                <li>No products available.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
